<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11100e">
<title>FRISCHE NEHRUNG — Меню</title>
<style>
:root{--bg:#11100e;--ui:rgba(10,10,9,.72)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{position:fixed;inset:0;min-width:320px;font-family:Arial,sans-serif;touch-action:none}
.carousel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#3a3731 0,transparent 45%),#11100e}
.viewport{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(40px);pointer-events:none;transition:opacity .38s ease,transform .38s cubic-bezier(.22,.61,.36,1)}
.slide.active{opacity:1;transform:none;pointer-events:auto}.slide img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 16px 50px #0008;cursor:default;user-select:none;-webkit-user-drag:none}
.arrow{position:absolute;top:50%;z-index:10;transform:translateY(-50%);width:52px;height:52px;border:0;border-radius:50%;background:var(--ui);color:#fff;display:grid;place-items:center;cursor:pointer}.arrow:hover{background:#000d}.prev{left:18px}.next{right:18px}.arrow svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.counter{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;z-index:10;transform:translateX(-50%);padding:7px 11px;border-radius:20px;background:var(--ui);color:#fff9;font-size:12px;letter-spacing:.08em}
.dots{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:50%;z-index:10;transform:translateX(-50%);display:flex;gap:8px;padding:8px 11px;border-radius:20px;background:var(--ui)}
.dot{width:8px;height:8px;border:0;border-radius:50%;padding:0;background:#fff5;cursor:pointer}.dot.active{width:22px;border-radius:10px;background:#fff}

@media(max-width:700px){.arrow{width:44px;height:44px}.prev{left:9px}.next{right:9px}.slide img{max-width:100vw;max-height:100vh;box-shadow:none}}
</style>
</head>
<body>
<div class="carousel">
 <section class="viewport" id="carousel">
  <div class="counter" id="counter">1 / 4</div>
  <div class="slide active"><img src="01-bar.jpg" alt="Бар — лист 1"></div>
  <div class="slide"><img src="02-beer.jpg" alt="Пиво — лист 1" loading="lazy"></div>
  <div class="slide"><img src="03-wine-card.jpg" alt="Винная карта — лист 2" loading="lazy"></div>
  <div class="slide"><img src="04-wines.jpg" alt="Вина — лист 2" loading="lazy"></div>
  <button class="arrow prev" id="prev" aria-label="Предыдущий лист"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
  <button class="arrow next" id="next" aria-label="Следующий лист"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  <div class="dots"><button class="dot active"></button><button class="dot"></button><button class="dot"></button><button class="dot"></button></div>
 </section>
</div>



<script>
const slides=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.dot')];
const carousel=document.getElementById('carousel'),counter=document.getElementById('counter');
let current=0,busy=false;

function show(i,dir=1){if(busy||i===current)return;busy=true;const old=current;current=(i+slides.length)%slides.length;slides[old].classList.remove('active');slides[old].style.transform=`translateX(${-dir*40}px)`;slides[current].style.transform=`translateX(${dir*40}px)`;requestAnimationFrame(()=>{slides[current].classList.add('active');slides[current].style.transform=''});dots.forEach((d,n)=>d.classList.toggle('active',n===current));counter.textContent=`${current+1} / ${slides.length}`;setTimeout(()=>{slides.forEach(s=>s.style.transform='');busy=false},400)}
function next(){show(current+1,1)} function prev(){show(current-1,-1)}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;dots.forEach((d,i)=>d.onclick=()=>show(i,i>current?1:-1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});

let sx=0,sy=0,swipe=false;
carousel.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY;swipe=false});
carousel.addEventListener('pointerup',e=>{if(!sx&&!sy)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev();sx=sy=0;swipe=false});


</script>
</body>
</html>
