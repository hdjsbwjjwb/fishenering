<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee9df">
  <title>FRISCHE NEHRUNG — Меню</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #eee9df;
      display: flex;
      justify-content: center;
      min-width: 320px;
    }
    main {
      width: 100%;
      max-width: 1000px;
    }
    .menu-page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      vertical-align: top;
    }
    @media (min-width: 1001px) {
      main { padding: 18px 0; }
      .menu-page {
        box-shadow: 0 2px 18px rgba(0,0,0,.10);
        margin-bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="menu-page" src="assets/01-bar.jpg" alt="Бар — лист 1" fetchpriority="high">
    <img class="menu-page" src="assets/02-beer.jpg" alt="Пиво — лист 1" loading="lazy">
    <img class="menu-page" src="assets/03-wine-card.jpg" alt="Винная карта — лист 2" loading="lazy">
    <img class="menu-page" src="assets/04-wines.jpg" alt="Вина — лист 2" loading="lazy">
  </main>
</body>
</html>
