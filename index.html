<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11100e">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>FRISCHE NEHRUNG — Меню</title>

  <style>
    :root {
      --bg: #11100e;
      --button: rgba(20, 19, 17, .78);
      --button-hover: rgba(10, 9, 8, .94);
      --glass: rgba(245, 241, 232, .78);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
    }

    body {
      min-width: 320px;
      position: fixed;
      inset: 0;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    /* Затемнённый неподвижный фон */
    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(75, 70, 62, .28), transparent 48%),
        #11100e;
    }

    .carousel {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(8px, 1.5vw, 20px);
    }

    .carousel__viewport {
      position: relative;
      width: min(100%, 1120px);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .carousel__track {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(4px, 1vw, 14px);
      opacity: 0;
      transform: translateX(42px) scale(.985);
      pointer-events: none;
      transition:
        opacity .42s ease,
        transform .42s cubic-bezier(.22,.61,.36,1);
    }

    .slide.is-active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
      z-index: 2;
    }

    .slide.is-leaving {
      opacity: 0;
      transform: translateX(-42px) scale(.985);
      z-index: 1;
    }

    .slide img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 14px 45px rgba(0, 0, 0, .42);
      background: #fff;
      user-select: none;
      -webkit-user-drag: none;
      cursor: zoom-in;
    }

    .arrow {
      position: absolute;
      top: 50%;
      z-index: 10;
      width: clamp(44px, 4.4vw, 58px);
      height: clamp(44px, 4.4vw, 58px);
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      background: var(--button);
      color: #fff;
      cursor: pointer;
      opacity: .9;
      transition: background .2s ease, transform .2s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .arrow:hover {
      background: var(--button-hover);
      opacity: 1;
    }

    .arrow:active {
      transform: translateY(-50%) scale(.93);
    }

    .arrow:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .arrow--prev { left: clamp(8px, 1.4vw, 20px); }
    .arrow--next { right: clamp(8px, 1.4vw, 20px); }

    .arrow svg {
      width: 56%;
      height: 56%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .counter {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      z-index: 10;
      transform: translateX(-50%);
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 12px;
      line-height: 1;
      letter-spacing: .08em;
      color: rgba(255,255,255,.84);
    }

    .dots {
      position: absolute;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 10;
      transform: translateX(-50%);
      display: flex;
      gap: 9px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      cursor: pointer;
      transition: width .2s ease, background .2s ease;
      touch-action: manipulation;
    }

    .dot.is-active {
      width: 22px;
      border-radius: 999px;
      background: rgba(255,255,255,.95);
    }

    /* Полноэкранный просмотр */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(5, 5, 4, .94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s ease, visibility .25s ease;
      touch-action: none;
    }

    .viewer.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .viewer__image-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .viewer__image {
      display: block;
      max-width: 94vw;
      max-height: 92vh;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      cursor: zoom-in;
      transform: scale(1);
      transition: transform .28s cubic-bezier(.22,.61,.36,1);
      transform-origin: center center;
    }

    .viewer.is-zoomed .viewer__image {
      transform: scale(2);
      cursor: zoom-out;
    }

    .viewer__close {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      z-index: 5;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.58);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-size: 28px;
      line-height: 1;
      font-weight: 300;
      touch-action: manipulation;
    }

    .viewer__close:hover {
      background: rgba(0,0,0,.82);
    }

    .viewer__hint {
      position: absolute;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(0,0,0,.52);
      color: rgba(255,255,255,.72);
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .carousel {
        padding: 0;
      }

      .carousel__viewport {
        width: 100%;
        height: 100%;
      }

      .slide {
        padding: 0;
      }

      .slide img {
        max-width: 100vw;
        max-height: 100vh;
        box-shadow: none;
      }

      .arrow {
        background: rgba(0,0,0,.58);
      }

      .arrow--prev { left: 10px; }
      .arrow--next { right: 10px; }

      .viewer {
        padding: 0;
      }

      .viewer__image {
        max-width: 100vw;
        max-height: 100vh;
      }

      .viewer.is-zoomed .viewer__image {
        transform: scale(2.2);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .slide,
      .viewer,
      .viewer__image,
      .arrow,
      .dot {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true"></div>

  <main class="carousel" aria-label="Меню FRISCHE NEHRUNG">
    <section class="carousel__viewport" id="carousel">

      <div class="counter" id="counter">1 / 4</div>

      <div class="carousel__track">

        <figure class="slide is-active" data-index="0">
          <img src="01-bar.jpg" alt="Бар — лист 1" draggable="false">
        </figure>

        <figure class="slide" data-index="1">
          <img src="02-beer.jpg" alt="Пиво — лист 1" draggable="false" loading="lazy">
        </figure>

        <figure class="slide" data-index="2">
          <img src="03-wine-card.jpg" alt="Винная карта — лист 2" draggable="false" loading="lazy">
        </figure>

        <figure class="slide" data-index="3">
          <img src="04-wines.jpg" alt="Вина — лист 2" draggable="false" loading="lazy">
        </figure>

      </div>

      <button class="arrow arrow--prev" id="prev" type="button" aria-label="Предыдущий лист">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5l-7 7 7 7"></path>
        </svg>
      </button>

      <button class="arrow arrow--next" id="next" type="button" aria-label="Следующий лист">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 5l7 7-7 7"></path>
        </svg>
      </button>

      <div class="dots" id="dots">
        <button class="dot is-active" type="button" aria-label="Лист 1"></button>
        <button class="dot" type="button" aria-label="Лист 2"></button>
        <button class="dot" type="button" aria-label="Лист 3"></button>
        <button class="dot" type="button" aria-label="Лист 4"></button>
      </div>

    </section>
  </main>

  <!-- Отдельный просмотр фотографии -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Просмотр листа меню">

    <button class="viewer__close" id="viewerClose" type="button" aria-label="Закрыть">×</button>

    <div class="viewer__image-wrap" id="viewerImageWrap">
      <img class="viewer__image" id="viewerImage" src="" alt="" draggable="false">
    </div>

    <div class="viewer__hint">Двойной тап — увеличить / вернуть размер</div>
  </div>

  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const dots = [...document.querySelectorAll('.dot')];
    const prevButton = document.getElementById('prev');
    const nextButton = document.getElementById('next');
    const counter = document.getElementById('counter');
    const carousel = document.getElementById('carousel');

    const viewer = document.getElementById('viewer');
    const viewerImage = document.getElementById('viewerImage');
    const viewerImageWrap = document.getElementById('viewerImageWrap');
    const viewerClose = document.getElementById('viewerClose');

    let current = 0;
    let isAnimating = false;

    let startX = 0;
    let startY = 0;
    let moved = false;

    let lastTap = 0;
    let viewerZoomed = false;

    function updateSlide(nextIndex, direction = 1) {
      if (isAnimating || nextIndex === current) return;

      isAnimating = true;

      const oldIndex = current;
      current = (nextIndex + slides.length) % slides.length;

      slides.forEach((slide, index) => {
        slide.classList.remove('is-active', 'is-leaving');

        if (index === current) {
          slide.style.transform = `translateX(${direction * 42}px) scale(.985)`;

          requestAnimationFrame(() => {
            slide.classList.add('is-active');
            slide.style.transform = '';
          });
        } else if (index === oldIndex) {
          slide.classList.add('is-leaving');
          slide.style.transform = `translateX(${-direction * 42}px) scale(.985)`;
        }
      });

      dots.forEach((dot, index) => {
        dot.classList.toggle('is-active', index === current);
      });

      counter.textContent = `${current + 1} / ${slides.length}`;

      setTimeout(() => {
        slides.forEach(slide => {
          slide.style.transform = '';
        });
        isAnimating = false;
      }, 460);
    }

    function next() {
      updateSlide(current + 1, 1);
    }

    function prev() {
      updateSlide(current - 1, -1);
    }

    nextButton.addEventListener('click', next);
    prevButton.addEventListener('click', prev);

    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        updateSlide(index, index > current ? 1 : -1);
      });
    });

    document.addEventListener('keydown', (event) => {
      if (viewer.classList.contains('is-open')) {
        if (event.key === 'Escape') closeViewer();
        return;
      }

      if (event.key === 'ArrowRight') next();
      if (event.key === 'ArrowLeft') prev();
    });

    /* Свайп по карусели */
    carousel.addEventListener('pointerdown', (event) => {
      if (event.target.closest('.arrow') || event.target.closest('.dots')) return;

      startX = event.clientX;
      startY = event.clientY;
      moved = false;
    });

    carousel.addEventListener('pointermove', (event) => {
      if (!startX && !startY) return;

      const dx = event.clientX - startX;
      const dy = event.clientY - startY;

      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
        moved = true;
      }
    });

    carousel.addEventListener('pointerup', (event) => {
      if (!startX && !startY) return;

      const dx = event.clientX - startX;
      const dy = event.clientY - startY;

      if (moved && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) next();
        else prev();
      }

      startX = 0;
      startY = 0;
      moved = false;
    });

    /* Открытие фотографии отдельно */
    slides.forEach((slide) => {
      const image = slide.querySelector('img');

      image.addEventListener('click', (event) => {
        event.stopPropagation();
        openViewer(image);
      });

      image.addEventListener('pointerup', (event) => {
        const now = Date.now();

        if (now - lastTap < 320) {
          event.preventDefault();
          toggleViewerZoom();
        }

        lastTap = now;
      });
    });

    function openViewer(image) {
      viewerImage.src = image.currentSrc || image.src;
      viewerImage.alt = image.alt;
      viewerZoomed = false;
      viewer.classList.remove('is-zoomed');
      viewer.classList.add('is-open');
    }

    function closeViewer() {
      viewer.classList.remove('is-open');
      viewer.classList.remove('is-zoomed');
      viewerZoomed = false;
    }

    function toggleViewerZoom() {
      if (!viewer.classList.contains('is-open')) return;

      viewerZoomed = !viewerZoomed;
      viewer.classList.toggle('is-zoomed', viewerZoomed);
    }

    viewerClose.addEventListener('click', closeViewer);

    /* Клик по затемнению закрывает просмотр */
    viewer.addEventListener('click', (event) => {
      if (event.target === viewer || event.target === viewerImageWrap) {
        closeViewer();
      }
    });

    /* Двойной клик на ПК */
    viewerImage.addEventListener('dblclick', (event) => {
      event.preventDefault();
      toggleViewerZoom();
    });

    /* Двойной тап непосредственно по большой фотографии */
    let viewerLastTap = 0;

    viewerImage.addEventListener('pointerup', (event) => {
      const now = Date.now();

      if (now - viewerLastTap < 350) {
        event.preventDefault();
        toggleViewerZoom();
      }

      viewerLastTap = now;
    });

    /* Внутри увеличенного изображения можно двигать пальцем/мышью.
       При простом просмотре свайп закрывает окно. */
    let viewerStartX = 0;
    let viewerStartY = 0;

    viewer.addEventListener('pointerdown', (event) => {
      viewerStartX = event.clientX;
      viewerStartY = event.clientY;
    });

    viewer.addEventListener('pointerup', (event) => {
      const dx = event.clientX - viewerStartX;
      const dy = event.clientY - viewerStartY;

      if (!viewerZoomed && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
        closeViewer();
      }
    });
  </script>
</body>
</html>
