<style>
  :root{
    --void:#0e0a07;
    --panel:#171009;
    --panel-2:#1d1610;
    --brass:#c9a24b;
    --brass-soft:#d9bd7c;
    --brass-dim:#6e5a34;
    --brass-faint:#3a2f1c;
    --wine:#6e1f2e;
    --cream:#efe3cb;
    --cream-dim:#a3937a;
    --cream-faint:#786a54;
    --header-h:64px;
    --tabbar-h:52px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; background:var(--void); overscroll-behavior:none;}
  body{
    font-family:'Cormorant Garamond', Georgia, serif;
    color:var(--cream);
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
    position:relative;
    opacity:0;
    animation:riseIn .8s cubic-bezier(.2,.8,.2,1) .05s forwards;
  }
  @keyframes riseIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .glow{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(201,162,75,.10), transparent 60%),
      radial-gradient(ellipse 80% 35% at 50% 100%, rgba(110,31,46,.14), transparent 70%);
  }

  /* header */
  header.top{
    position:relative; z-index:3;
    flex-shrink:0;
    text-align:center;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 12px 8px;
  }
  .brand{display:flex; align-items:center; justify-content:center; gap:8px;}
  .brand-mark{color:var(--brass); font-size:11px; opacity:.8;}
  header.top h1{
    margin:0; font-family:'UnifrakturCook', cursive; font-weight:700;
    font-size:clamp(22px,7vw,30px); letter-spacing:.5px; color:var(--brass-soft);
    text-shadow:0 0 18px rgba(201,162,75,.22); line-height:1;
  }
  .subtitle{
    margin:5px 0 0; font-size:10.5px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--cream-dim); font-style:italic; font-weight:500;
  }

  /* tabbar */
  .tabbar{
    position:relative; z-index:3; flex-shrink:0;
    display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
    padding:10px 14px; border-top:1px solid var(--brass-faint); border-bottom:1px solid var(--brass-faint);
    background:linear-gradient(180deg, rgba(23,16,9,.6), rgba(23,16,9,.3));
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab-chip{
    flex:0 0 auto;
    font-family:'Cormorant Garamond', serif;
    font-size:14.5px; font-weight:600; letter-spacing:.03em;
    color:var(--cream-dim);
    background:transparent;
    border:1px solid var(--brass-faint);
    border-radius:999px;
    padding:7px 15px;
    cursor:pointer;
    transition:all .3s ease;
    white-space:nowrap;
  }
  .tab-chip.active{
    color:var(--void);
    background:var(--brass-soft);
    border-color:var(--brass-soft);
    box-shadow:0 0 14px rgba(201,162,75,.35);
  }

  /* deck of panels */
  .deck{
    flex:1; min-height:0; position:relative; z-index:2;
    display:flex; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .deck::-webkit-scrollbar{display:none;}

  .panel{
    flex:0 0 100vw; scroll-snap-align:center; scroll-snap-stop:always;
    height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:0 0 40px;
  }

  .tab-note{
    font-size:11.5px; font-style:italic; color:var(--cream-faint);
    text-align:center; padding:12px 20px 2px; letter-spacing:.02em;
  }

  /* sub nav (sections within a panel) */
  .subbar{
    position:sticky; top:0; z-index:2;
    display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
    padding:10px 14px; margin-top:4px;
    background:linear-gradient(180deg, var(--void) 70%, transparent);
  }
  .subbar::-webkit-scrollbar{display:none;}
  .sub-chip{
    flex:0 0 auto;
    font-family:'Cormorant Garamond', serif;
    font-size:12.5px; font-style:italic; letter-spacing:.03em;
    color:var(--brass-dim);
    background:var(--panel);
    border:1px solid var(--brass-faint);
    border-radius:999px;
    padding:5px 13px;
    cursor:pointer;
    transition:all .25s ease;
    white-space:nowrap;
  }
  .sub-chip.active{
    color:var(--brass-soft);
    border-color:var(--brass);
    background:var(--panel-2);
  }

  section.menu-section{ padding:2px 0 6px; scroll-margin-top:64px; }
  .section-title{
    font-size:12px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--brass); text-align:center; margin:18px 0 4px;
    font-style:normal; font-weight:600;
  }

  .group-label{
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--cream-dim); text-align:left; margin:16px 20px 6px;
    border-bottom:1px solid var(--brass-faint); padding-bottom:5px;
  }

  .items{ padding:0 18px; }
  .item-row{
    display:flex; align-items:flex-start; gap:8px;
    padding:9px 2px;
    border-bottom:1px solid rgba(110,90,52,.18);
  }
  .item-row:last-child{border-bottom:none;}
  .item-main{flex:1 1 auto; min-width:0;}
  .item-name{font-size:16.5px; color:var(--cream); line-height:1.25;}
  .item-tag{font-size:12.5px; font-style:italic; color:var(--cream-dim); margin-left:2px;}
  .item-desc{font-size:12.5px; font-style:italic; color:var(--cream-faint); margin-top:2px; line-height:1.3;}

  .price-single{
    flex:0 0 auto; font-size:16px; color:var(--brass-soft);
    font-variant-numeric:tabular-nums; white-space:nowrap; padding-top:1px;
  }
  .price-stack{flex:0 0 auto; text-align:right;}
  .price-line{
    display:flex; align-items:baseline; justify-content:flex-end; gap:6px;
    font-size:13.5px; color:var(--brass-soft); white-space:nowrap;
  }
  .price-line .vol{font-size:11px; font-style:italic; color:var(--cream-faint);}
  .price-line + .price-line{margin-top:2px;}

  @media (prefers-reduced-motion: reduce){ .app{animation:none; opacity:1;} }

  @media (min-width:720px){
    .panel{max-width:640px; margin:0 auto;}
    header.top h1{font-size:32px;}
  }
</style>
</head>

/* ============ РЕНДЕР ============ */
(function(){
  const tabbar = document.getElementById('tabbar');
  const deck = document.getElementById('deck');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fmt(n){ return n.toLocaleString('ru-RU') + ' ₽'; }

  function renderItem(item){
    const row = document.createElement('div');
    row.className = 'item-row';

    const main = document.createElement('div');
    main.className = 'item-main';
    const nameLine = document.createElement('span');
    nameLine.className = 'item-name';
    nameLine.textContent = item.name;
    main.appendChild(nameLine);
    if (item.tag){
      const tag = document.createElement('span');
      tag.className = 'item-tag';
      tag.textContent = item.tag;
      main.appendChild(tag);
    }
    if (item.desc){
      const desc = document.createElement('div');
      desc.className = 'item-desc';
      desc.textContent = item.desc;
      main.appendChild(desc);
    }
    row.appendChild(main);

    if (item.variants.length <= 1){
      const price = document.createElement('div');
      price.className = 'price-single';
      price.textContent = fmt(item.variants[0].price);
      row.appendChild(price);
    } else {
      const stack = document.createElement('div');
      stack.className = 'price-stack';
      item.variants.forEach(v => {
        const line = document.createElement('div');
        line.className = 'price-line';
        if (v.label){
          const vol = document.createElement('span');
          vol.className = 'vol';
          vol.textContent = v.label;
          line.appendChild(vol);
        }
        const amt = document.createElement('span');
        amt.textContent = fmt(v.price);
        line.appendChild(amt);
        stack.appendChild(line);
      });
      row.appendChild(stack);
    }
    return row;
  }

  function renderSection(section, sectionId){
    const sec = document.createElement('section');
    sec.className = 'menu-section';
    sec.id = sectionId;

    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = section.title;
    sec.appendChild(title);

    section.groups.forEach(group => {
      if (group.label){
        const gl = document.createElement('div');
        gl.className = 'group-label';
        gl.textContent = group.label;
        sec.appendChild(gl);
      }
      const items = document.createElement('div');
      items.className = 'items';
      group.items.forEach(it => items.appendChild(renderItem(it)));
      sec.appendChild(items);
    });

    return sec;
  }

  function buildPanel(tab){
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + tab.id;

    if (tab.note){
      const note = document.createElement('p');
      note.className = 'tab-note';
      note.textContent = tab.note;
      panel.appendChild(note);
    }

    let subbar = null;
    if (tab.sections.length > 1){
      subbar = document.createElement('div');
      subbar.className = 'subbar';
      panel.appendChild(subbar);
    }

    const subChips = [];
    tab.sections.forEach((section, i) => {
      const sectionId = tab.id + '-sec-' + i;
      const secEl = renderSection(section, sectionId);
      panel.appendChild(secEl);

      if (subbar){
        const chip = document.createElement('button');
        chip.className = 'sub-chip';
        chip.textContent = section.title;
        chip.addEventListener('click', () => {
          secEl.scrollIntoView({behavior:'smooth', block:'start'});
        });
        subbar.appendChild(chip);
        subChips.push({chip, el: secEl});
      }
    });

    if (subbar && subChips.length){
      subChips[0].chip.classList.add('active');
      const io = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting){
            const match = subChips.find(s => s.el === entry.target);
            if (match){
              subChips.forEach(s => s.chip.classList.remove('active'));
              match.chip.classList.add('active');
            }
          }
        });
      }, { root: panel, rootMargin: '0px 0px -70% 0px', threshold: 0 });
      subChips.forEach(s => io.observe(s.el));
    }

    return panel;
  }

  const tabChips = [];
  const panels = [];
  MENU.forEach((tab, i) => {
    const chip = document.createElement('button');
    chip.className = 'tab-chip';
    chip.textContent = tab.label;
    chip.addEventListener('click', () => goToTab(i));
    tabbar.appendChild(chip);
    tabChips.push(chip);

    const panel = buildPanel(tab);
    deck.appendChild(panel);
    panels.push(panel);
  });

  let current = 0;
  function setActiveTab(index){
    if (index === current) { tabChips[index].classList.add('active'); }
    current = index;
    tabChips.forEach((c, i) => c.classList.toggle('active', i === index));
    const activeChip = tabChips[index];
    activeChip.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  function goToTab(index){
    index = Math.max(0, Math.min(panels.length - 1, index));
    panels[index].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  let ticking = false;
  function onDeckScroll(){
    if (!ticking){
      requestAnimationFrame(() => {
        const deckRect = deck.getBoundingClientRect();
        const centerX = deckRect.left + deckRect.width / 2;
        let closestIndex = 0, closestDist = Infinity;
        panels.forEach((p, i) => {
          const r = p.getBoundingClientRect();
          const c = r.left + r.width / 2;
          const d = Math.abs(c - centerX);
          if (!reduceMotion){
            const norm = Math.max(-1, Math.min(1, (c - centerX) / deckRect.width));
            p.style.opacity = String(Math.max(0.5, 1 - Math.abs(norm) * 0.6));
          }
          if (d < closestDist){ closestDist = d; closestIndex = i; }
        });
        if (closestIndex !== current) setActiveTab(closestIndex);
        ticking = false;
      });
      ticking = true;
    }
  }
  deck.addEventListener('scroll', onDeckScroll, {passive:true});

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') goToTab(current + 1);
    if (e.key === 'ArrowLeft') goToTab(current - 1);
  });

  setActiveTab(0);
})();
</script>
