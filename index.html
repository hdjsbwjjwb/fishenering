<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Frische Nehrung — Меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0e0a07;
    --panel:#1c150e;
    --brass:#c9a24b;
    --brass-soft:#d9bd7c;
    --brass-dim:#6e5a34;
    --wine:#6e1f2e;
    --cream:#efe3cb;
    --cream-dim:#a3937a;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    margin:0;
    background:var(--void);
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    font-family:'Cormorant Garamond', Georgia, serif;
    color:var(--cream);
    position:relative;
  }

  .grain{
    position:fixed; inset:0;
    pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(239,227,203,0.035) 1px, transparent 0);
    background-size:3px 3px;
    z-index:1;
  }

  .stage{
    position:relative;
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
    opacity:0;
    animation:riseIn .9s cubic-bezier(.2,.8,.2,1) .1s forwards;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .glow{
    position:absolute; inset:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 50% at 50% 42%, rgba(201,162,75,0.12), transparent 62%),
      radial-gradient(ellipse 80% 40% at 50% 100%, rgba(110,31,46,0.16), transparent 70%);
    z-index:0;
  }

  .topbar{
    position:relative;
    z-index:2;
    text-align:center;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 10px;
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .brand-mark{
    color:var(--brass);
    font-size:14px;
    opacity:.85;
  }
  .topbar h1{
    margin:0;
    font-family:'UnifrakturCook', cursive;
    font-weight:700;
    font-size:clamp(26px, 8vw, 40px);
    letter-spacing:.5px;
    color:var(--brass-soft);
    text-shadow:0 0 24px rgba(201,162,75,.25);
    line-height:1;
  }
  .subtitle{
    margin:8px 0 0;
    font-size:12px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--cream-dim);
    font-style:italic;
    font-weight:500;
  }

  .deck{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    perspective:1600px;
    min-height:0;
  }
  .deck::-webkit-scrollbar{display:none;}
  .deck{scrollbar-width:none;}

  .page{
    flex:0 0 100vw;
    scroll-snap-align:center;
    scroll-snap-stop:always;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px 20px;
  }
  .page img{
    max-height:74dvh;
    max-width:88vw;
    width:auto;
    height:auto;
    object-fit:contain;
    border-radius:5px;
    box-shadow:
      0 30px 70px -18px rgba(0,0,0,.75),
      0 0 0 1px rgba(201,162,75,.18);
    will-change:transform, opacity;
    transform-origin:center center;
    user-select:none;
    pointer-events:none;
  }

  .side-arrow{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    z-index:3;
    width:42px; height:42px;
    border-radius:50%;
    border:1px solid var(--brass-dim);
    background:rgba(20,15,10,.45);
    backdrop-filter:blur(6px);
    color:var(--brass-soft);
    font-size:20px;
    font-family:Georgia, serif;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:opacity .25s ease, border-color .25s ease, transform .2s ease;
    opacity:.55;
  }
  .side-arrow:hover{opacity:1; border-color:var(--brass);}
  .side-arrow:active{transform:translateY(-50%) scale(.92);}
  .side-arrow:disabled{opacity:.15; pointer-events:none;}
  .side-arrow.prev{left:calc(env(safe-area-inset-left,0px) + 10px);}
  .side-arrow.next{right:calc(env(safe-area-inset-right,0px) + 10px);}
  @media (max-width:420px){
    .side-arrow{width:36px; height:36px; font-size:17px;}
  }

  .bottom-bar{
    position:relative;
    z-index:2;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  }
  .dots{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    border:1px solid var(--brass-dim);
    background:transparent;
    padding:0;
    cursor:pointer;
    transition:all .35s cubic-bezier(.2,.8,.2,1);
  }
  .dot.active{
    width:22px;
    border-radius:5px;
    background:var(--brass);
    border-color:var(--brass);
    box-shadow:0 0 10px rgba(201,162,75,.55);
  }
  .counter{
    font-size:11px;
    letter-spacing:.3em;
    color:var(--cream-dim);
    font-style:italic;
  }
  .counter b{color:var(--brass-soft); font-style:normal;}

  .hint{
    position:absolute;
    bottom:calc(env(safe-area-inset-bottom,0px) + 56px);
    left:0; right:0;
    text-align:center;
    z-index:2;
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--cream-dim);
    opacity:.75;
    pointer-events:none;
    animation:driftHint 2.6s ease-in-out infinite;
  }
  .hint.hidden{opacity:0; transition:opacity .6s ease;}
  @keyframes driftHint{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(5px);}
  }

  @media (prefers-reduced-motion: reduce){
    .stage{animation:none; opacity:1;}
    .hint{animation:none;}
    .page img{transition:none !important;}
  }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="stage">
    <div class="glow"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <h1>Frische Nehrung</h1>
        <span class="brand-mark">✦</span>
      </div>
      <p class="subtitle">Меню · Балтийская коса</p>
    </header>

    <button class="side-arrow prev" id="prev" aria-label="Предыдущая страница">‹</button>
    <button class="side-arrow next" id="next" aria-label="Следующая страница">›</button>

    <div class="deck" id="deck">
      <div class="page"><img src="01-bar.jpg" alt="Барная карта: виски, ром, водка, джин, текила, абсент, коктейли" draggable="false"></div>
      <div class="page"><img src="02-beer.jpg" alt="Пивная карта: разливное и бутылочное пиво, сидр, закуски, напитки" draggable="false"></div>
      <div class="page"><img src="03-wine-card.jpg" alt="Винная карта — титульная страница" draggable="false"></div>
      <div class="page"><img src="04-wines.jpg" alt="Винная карта: белые, красные и игристые вина" draggable="false"></div>
    </div>

    <p class="hint" id="hint">← свайпните, чтобы листать →</p>

    <div class="bottom-bar">
      <div class="dots" id="dots"></div>
      <div class="counter" id="counter">01 / 04</div>
    </div>
  </div>

<script>
(function(){
  var deck = document.getElementById('deck');
  var pages = Array.prototype.slice.call(deck.querySelectorAll('.page'));
  var dotsWrap = document.getElementById('dots');
  var counter = document.getElementById('counter');
  var hint = document.getElementById('hint');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var current = 0;
  var interacted = false;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  pages.forEach(function(_, i){
    var d = document.createElement('button');
    d.className = 'dot';
    d.setAttribute('aria-label', 'Страница ' + (i+1));
    d.addEventListener('click', function(){ goTo(i); });
    dotsWrap.appendChild(d);
  });
  var dots = Array.prototype.slice.call(dotsWrap.children);

  function markInteracted(){
    if (interacted) return;
    interacted = true;
    hint.classList.add('hidden');
  }

  function updateChrome(index){
    dots.forEach(function(d, i){ d.classList.toggle('active', i === index); });
    var total = pages.length;
    counter.innerHTML = '<b>' + String(index+1).padStart(2,'0') + '</b> / ' + String(total).padStart(2,'0');
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === total - 1;
  }

  function goTo(index){
    index = Math.max(0, Math.min(pages.length - 1, index));
    markInteracted();
    pages[index].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }

  prevBtn.addEventListener('click', function(){ goTo(current - 1); });
  nextBtn.addEventListener('click', function(){ goTo(current + 1); });

  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') goTo(current + 1);
    if (e.key === 'ArrowLeft') goTo(current - 1);
  });

  var ticking = false;
  function onScroll(){
    markInteracted();
    if (!ticking){
      requestAnimationFrame(function(){
        applyTilt();
        ticking = false;
      });
      ticking = true;
    }
  }

  function applyTilt(){
    var deckRect = deck.getBoundingClientRect();
    var centerX = deckRect.left + deckRect.width / 2;
    var closestIndex = 0;
    var closestDist = Infinity;

    pages.forEach(function(page, i){
      var img = page.querySelector('img');
      var rect = page.getBoundingClientRect();
      var pageCenter = rect.left + rect.width / 2;
      var dist = pageCenter - centerX;
      var norm = Math.max(-1, Math.min(1, dist / deckRect.width));

      if (!reduceMotion){
        var rotate = norm * -13;
        var scale = 1 - Math.abs(norm) * 0.13;
        var opacity = 1 - Math.abs(norm) * 0.4;
        img.style.transform = 'rotateY(' + rotate + 'deg) scale(' + scale + ')';
        img.style.opacity = String(Math.max(0.55, opacity));
      }

      if (Math.abs(dist) < closestDist){
        closestDist = Math.abs(dist);
        closestIndex = i;
      }
    });

    if (closestIndex !== current){
      current = closestIndex;
      updateChrome(current);
    }
  }

  deck.addEventListener('scroll', onScroll, {passive:true});
  deck.addEventListener('touchstart', markInteracted, {passive:true});
  window.addEventListener('resize', applyTilt);

  setTimeout(function(){ hint.classList.add('hidden'); }, 4200);

  updateChrome(0);
  applyTilt();
})();
</script>
</body>
</html>
